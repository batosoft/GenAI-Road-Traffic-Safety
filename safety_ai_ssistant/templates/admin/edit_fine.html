<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salama AI Assistant - Edit Fine</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1>Edit Traffic Fine</h1>
        </div>
        
        <div class="admin-menu">
            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">Dashboard</a>
            <a href="{{ url_for('admin_fines') }}" class="btn btn-secondary">Manage Fines</a>
        </div>
        
        {% if error %}
        <div class="alert alert-danger">
            {{ error }}
        </div>
        {% endif %}
        
        <div class="admin-content">
            <form class="admin-form" method="POST" action="{{ url_for('admin_edit_fine', fine_id=fine.id) }}">
                <div class="form-group">
                    <label for="user_id">User ID</label>
                    <input type="text" id="user_id" name="user_id" class="form-control" value="{{ fine.user_id }}" required>
                </div>
                
                <div class="form-group">
                    <label for="vehicle_info">Vehicle Information</label>
                    <input type="text" id="vehicle_info" name="vehicle_info" class="form-control" value="{{ fine.vehicle_info }}" required>
                </div>
                
                <div class="form-group">
                    <label for="issue_date">Issue Date</label>
                    <input type="datetime-local" id="issue_date" name="issue_date" class="form-control" value="{{ fine.issue_date|replace(' ', 'T') }}" required>
                </div>
                
                <div class="form-group">
                    <label for="amount">Amount (AED)</label>
                    <input type="number" id="amount" name="amount" class="form-control" step="0.01" value="{{ fine.amount }}" required>
                </div>
                
                <div class="form-group">
                    <label for="source">Source</label>
                    <select id="source" name="source" class="form-control" required>
                        <option value="">Select Source</option>
                        <option value="Dubai Police" {% if fine.source == 'Dubai Police' %}selected{% endif %}>Dubai Police</option>
                        <option value="Sharjah Municipality" {% if fine.source == 'Sharjah Municipality' %}selected{% endif %}>Sharjah Municipality</option>
                        <option value="Abu Dhabi Police" {% if fine.source == 'Abu Dhabi Police' %}selected{% endif %}>Abu Dhabi Police</option>
                        <option value="RTA" {% if fine.source == 'RTA' %}selected{% endif %}>RTA</option>
                        <option value="Ajman Police" {% if fine.source == 'Ajman Police' %}selected{% endif %}>Ajman Police</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="black_points">Black Points</label>
                    <input type="number" id="black_points" name="black_points" class="form-control" value="{{ fine.black_points }}">
                </div>
                
                <div class="form-group">
                    <label for="location">Location</label>
                    <input type="text" id="location" name="location" class="form-control" value="{{ fine.location }}" required>
                </div>
                
                <div class="form-group">
                    <label for="violation_details">Violation Details</label>
                    <select id="violation_details" name="violation_details" class="form-control" required>
                        <option value="">Select Violation Type</option>
                        <option value="Exceeding maximum speed limit" {% if fine.violation_details == 'Exceeding maximum speed limit' %}selected{% endif %}>Exceeding maximum speed limit</option>
                        <option value="Parking violation" {% if fine.violation_details == 'Parking violation' %}selected{% endif %}>Parking violation</option>
                        <option value="Using phone while driving" {% if fine.violation_details == 'Using phone while driving' %}selected{% endif %}>Using phone while driving</option>
                        <option value="Running red light" {% if fine.violation_details == 'Running red light' %}selected{% endif %}>Running red light</option>
                        <option value="Not wearing seatbelt" {% if fine.violation_details == 'Not wearing seatbelt' %}selected{% endif %}>Not wearing seatbelt</option>
                        <option value="Driving with expired registration" {% if fine.violation_details == 'Driving with expired registration' %}selected{% endif %}>Driving with expired registration</option>
                        <option value="Illegal lane change" {% if fine.violation_details == 'Illegal lane change' %}selected{% endif %}>Illegal lane change</option>
                        <option value="Driving against traffic" {% if fine.violation_details == 'Driving against traffic' %}selected{% endif %}>Driving against traffic</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="fine_number">Fine Number</label>
                    <input type="text" id="fine_number" name="fine_number" class="form-control" value="{{ fine.fine_number }}" required>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Update Fine</button>
                    <a href="{{ url_for('admin_fines') }}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
